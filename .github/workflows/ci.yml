name: Test and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run isolated synthetic software tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser interaction tests
        run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: ui-test-results/results.json
      - name: Build container
        run: docker build -t news-sentiment:${{ github.sha }} .
      - name: Run tests inside container
        run: docker run --rm news-sentiment:${{ github.sha }} python -m unittest discover -s tests -v
